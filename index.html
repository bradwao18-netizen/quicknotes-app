<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QuickNotes</h1>
            <p class="subtitle">Your simple and organized note-taking companion</p>
        </header>

        <main>
            <!-- Note Creation Form -->
            <section class="form-section">
                <h2>Add a note</h2>
                
                <!-- Inline Error Message Display -->
                <p id="error-message" class="error-message" style="display: none;"></p>

                <form id="note-form">
                    <div class="form-group">
                        <label for="note-input">Your note</label>
                        <textarea 
                            id="note-input" 
                            placeholder="Type your note here..." 
                            maxlength="200"
                            required></textarea>
                        <span id="char-count" class="char-count">200 characters remaining</span>
                    </div>

                    <div class="form-group">
                        <label for="note-category">Category</label>
                        <select id="note-category">
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="Study">Study</option>
                        </select>
                    </div>

                    <button type="submit" id="add-btn">Add Note</button>
                </form>
            </section>

            <!-- Search & Notes Display Section -->
            <section class="notes-section">
                <h2>Your Notes</h2>
                
                <div class="search-container">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Search notes...">
                </div>

                <p id="note-counter" class="note-counter">You have no notes yet.</p>

                <ul id="notes-list" class="notes-list"></ul>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 QuickNotes</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
